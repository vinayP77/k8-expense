apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: expense
  labels:
    app: backend
    tier: backend
    project: expense
spec:  
  replicas: 1
  selector:
    matchLabels:
       app: backend
       tier: backend
       project: expense
  template:
    metadata:
      labels:
        app: backend
        tier: backend
        project: expense
    spec:
      containers:
        - name: backend
          image: vinayp77/backend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_USER
              value: expense
            - name: DB_PASSWORD
              value: your_password
            - name: DB_HOST
              value: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: expense
spec:
  selector:  # labels are used as selectors
        app: backend
        tier: backend
        project: expense
  ports:
    - protocol: TCP
      port: 8080      # service port
      targetPort: 8080  # container port