apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-dynamic-s1
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-dynamic-s1
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: efs-dynamic1-s1
  labels:
    purpose: efs-dynamic
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: data
      mountPath: /usr/share/nginx/html
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: efs-dynamic-s1
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-lb
spec:
  selector:
    purpose: efs-dynamic
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  